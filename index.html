<!DOCTYPE html>
<html lang="en">
<head>
<style>.lang-btn{display:none!important;}</style>
<script>
(function(){
  const list = document.getElementById('plt-lang-list');
  if(list){
    list.innerHTML = '<div onclick="pltApplyLang(\'en\',\'ENG\')" style="padding:10px 14px;color:#f8fafc;font-size:13px;font-weight:600;cursor:pointer;">🇬🇧 English</div>' +
                     '<div onclick="pltApplyLang(\'it\',\'ITA\')" style="padding:10px 14px;color:#f8fafc;font-size:13px;font-weight:600;cursor:pointer;border-top:1px solid rgba(255,255,255,0.08);">🇮🇹 Italiano</div>';
  }
  window.pltApplyLang = function(code, label){
    localStorage.setItem('plt_lang_code', code);
    localStorage.setItem('plt_lang_lbl', label);
    const cur = document.getElementById('plt-cur-lang'); if(cur) cur.textContent = label;
    if(list) list.style.display = 'none';
    if(typeof switchLang === 'function') switchLang(code);
    if(typeof setDocsLang === 'function') setDocsLang(code);
    if(typeof setContactLang === 'function') setContactLang(code);
    if(typeof setL === 'function') setL(code);
  };
  document.addEventListener('click', ()=>{
    const m = document.getElementById('plt-nav-list');
    if(list) list.style.display='none'; if(m) m.style.display='none';
  });
  window.addEventListener('DOMContentLoaded', ()=>{
    const c = (localStorage.getItem('plt_lang_code') === 'it') ? 'it' : 'en';
    const lbl = (c === 'it') ? 'ITA' : 'ENG';
    pltApplyLang(c, lbl);
  });
})();
</script>

</body>
</html>
